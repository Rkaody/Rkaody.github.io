<header class="site-header">
  <nav class="nav-wrapper">
    <a href="{{ '/' | relative_url }}" class="site-title">
      <svg class="site-title-cat" width="22" height="22" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- ears -->
        <polygon points="10,38 22,8 34,38"/>
        <polygon points="66,38 78,8 90,38"/>
        <!-- head -->
        <ellipse cx="50" cy="48" rx="30" ry="26"/>
        <!-- body -->
        <ellipse cx="50" cy="80" rx="22" ry="18"/>
        <!-- tail -->
        <path d="M72,80 Q95,70 90,50 Q88,42 82,46 Q86,62 68,72" fill="currentColor"/>
        <!-- whisker dots -->
        <circle cx="38" cy="50" r="2.5"/>
        <circle cx="62" cy="50" r="2.5"/>
        <!-- eyes -->
        <ellipse cx="41" cy="44" rx="4" ry="5" fill="#171717"/>
        <ellipse cx="59" cy="44" rx="4" ry="5" fill="#171717"/>
        <!-- nose -->
        <polygon points="50,51 47,54 53,54" fill="#171717"/>
      </svg>
      {{ site.title }}
    </a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a></li>
        <li><a href="{{ '/posts' | relative_url }}" {% if page.url contains 'posts' %}class="active"{% endif %}>Posts</a></li>
        <li><a href="{{ '/archive' | relative_url }}" {% if page.url contains 'archive' %}class="active"{% endif %}>Archive</a></li>
      </ul>
      <button class="search-btn" onclick="toggleSearch()" aria-label="검색">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </nav>
  <div class="search-bar" id="searchBar">
    <div class="search-inner">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요..." onkeyup="searchPosts()">
      <button onclick="toggleSearch()">✕</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</header>

<script>
  var searchData = [];
  {% assign posts = site.posts %}
  searchData = [
    {% for post in posts %}
    {
      title: {{ post.title | jsonify }},
      url: {{ post.url | relative_url | jsonify }},
      excerpt: {{ post.excerpt | strip_html | truncate: 100 | jsonify }},
      date: {{ post.date | date: "%Y.%m.%d" | jsonify }},
      category: {{ post.categories[0] | default: "" | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function toggleSearch() {
    var bar = document.getElementById('searchBar');
    bar.classList.toggle('active');
    if (bar.classList.contains('active')) {
      document.getElementById('searchInput').focus();
    } else {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    }
  }

  function searchPosts() {
    var query = document.getElementById('searchInput').value.toLowerCase();
    var results = document.getElementById('searchResults');
    if (query.length < 1) { results.innerHTML = ''; return; }
    var filtered = searchData.filter(function(p) {
      return p.title.toLowerCase().includes(query) || p.excerpt.toLowerCase().includes(query);
    });
    if (filtered.length === 0) {
      results.innerHTML = '<p class="no-result">검색 결과가 없습니다.</p>';
      return;
    }
    results.innerHTML = filtered.slice(0, 5).map(function(p) {
      return '<a href="' + p.url + '" class="search-result-item"><strong>' + p.title + '</strong><span>' + p.date + (p.category ? ' · ' + p.category : '') + '</span></a>';
    }).join('');
  }
</script>
